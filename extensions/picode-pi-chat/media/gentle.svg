<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Gentle AI</title>
  <!--
    The activity bar masks its icons, so this has to be a monochrome silhouette:
    it is drawn in the same hand-authored line style as `picode.svg` beside it
    (stroke only, round caps, the same grey the mask reads). The brand's own mark
    is a rendered illustration, which is why the activity bar gets this mark and
    the panel gets the real one.
  -->
