<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PiCode</title>
  <rect width="1024" height="1024" rx="224" fill="#1E1E1E"/>
  <g transform="translate(0,92)" fill="none" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <!-- antenna -->
    <path d="M512 200 V152" stroke="#F5F5F5" stroke-width="40"/>
    <circle cx="512" cy="112" r="36" fill="#3B9BFF" stroke="none"/>
    <!-- robot head + pi legs, one continuous silhouette -->
    <path d="M360 640 V262 Q360 200 422 200 H602 Q664 200 664 262 V640" stroke="#F5F5F5"/>
    <!-- pi crossbar -->
    <path d="M268 432 H756" stroke="#F5F5F5"/>
    <!-- eyes -->
    <circle cx="452" cy="316" r="26" fill="#3B9BFF" stroke="none"/>
    <circle cx="572" cy="316" r="26" fill="#3B9BFF" stroke="none"/>
    <!-- chevron feet: < and > -->
    <path d="M424 590 L360 660 L424 730" stroke="#3B9BFF"/>
    <path d="M600 590 L664 660 L600 730" stroke="#3B9BFF"/>
  </g>
</svg>
