name: ✨ Feature request
description: A change to what PiCode is or does
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PiCode has written product rules, and a proposal that fits them saves a
        round of questions. The short version: no PiCode-owned panel, tab or
        settings page; nothing is reimplemented that Pi already ships; a datum
        appears once; anything that requires an action is a button.

        The long version lives in the
        [wiki](https://github.com/Tomas-Platero/PiCode/wiki), and in the
        product rules written in `AGENTS.md` at the repository root.
  - type: textarea
    id: problem
    attributes:
      label: What hurts today
      description: >
        The situation and what you actually wanted to do. Not the solution —
        the problem.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What you would like
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Which layer would it touch
      description: A guess is fine.
      options:
        - The editor itself
        - The product layer (identity, defaults, packaging)
        - Agent integration (chat, providers, MCP, agent host)
        - Build pipeline or CI
        - Documentation or wiki
        - Don't know
    validations:
      required: true
  - type: textarea
    id: no
    attributes:
      label: What you considered and rejected
      placeholder: Alternatives that would not solve it, and why.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues, open and closed
          required: true
        - label: >-
            It does not contradict a decision recorded in the wiki (or I
            explain below why that decision should change)
          required: true
