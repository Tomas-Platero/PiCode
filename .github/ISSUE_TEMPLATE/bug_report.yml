name: 🐞 Bug report
description: >-
  Something PiCode does that it should not — or does not do that it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A precise report is the
        difference between a fix in minutes and a week of guessing.

        **Do not report security problems here.** Anything that could be a
        vulnerability goes privately through the
        [security advisory form][adv] instead — see [SECURITY.md][sec].

        Not sure whether it is a PiCode bug or a Pi one?
        The [wiki](https://github.com/Tomas-Platero/PiCode/wiki) and the
        [FAQ](https://github.com/Tomas-Platero/PiCode/wiki/FAQ) tell you which
        project owns which part.

        [adv]: https://github.com/Tomas-Platero/PiCode/security/advisories/new
        [sec]: https://github.com/Tomas-Platero/PiCode/blob/master/SECURITY.md
  - type: markdown
    attributes:
      value: |
        ### What you are running
  - type: input
    id: version
    attributes:
      label: PiCode version
      description: >-
        Open **Help → About**, or read the name of the file you downloaded.
      placeholder: "0.2.1"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      description: Each channel has its own update feed and its own branch.
      options:
        - Stable (recommended)
        - Beta (early access)
        - Experimental (freshest work)
        - I built it myself from source
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux — Arch / Debian / Fedora / other (say which below)
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### What happened
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The symptom in plain words — what you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open PiCode
        2. Run 'PiCode: Set up PiCode'
        3. Choose ...
        4. See ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        A screenshot, the exact error text, or the log. In a portable install
        the log lives under `data/user-data/logs/`, in the newest folder.
        Paste the **first** error, not the last — the last one is usually a
        consequence.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues, open and closed
          required: true
        - label: >-
            It happens on the latest release of my channel, or I say
            below why I cannot use it
          required: true
        - label: This is a bug in PiCode, not in the Pi agent itself
          required: true
        - label: This is not a security report — those go privately
          required: true
