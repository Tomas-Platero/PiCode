# Quick check: do the patches under `patches/**` still apply to the VS Code
# commit pinned in `upstream/stable.json`?
#
# It runs phases 1-5 of `dev/build.sh` (fetch + patch + product delta, no
# compile), so a patch that a new upstream revision invalidated shows up on the
# push that caused it instead of weeks later. Nothing is compiled and the source
# clone is never committed; the VS Code tree is fetched into `picode-source/`,
# which is gitignored, and cached between runs keyed by the pinned commit.
#
# Second entry point: `pin-watch.yml` dispatches this workflow on the branch of
# the pin-update pull request, passing `report_sha`. The check then writes a
# commit status on that commit, which is what makes the pull request show
# pass/fail and name the patch that broke.
name: Pin check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      report_sha:
        description: "Commit to attach the status to (set by pin-watch)"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: pin-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phases-1-5:
    name: phases 1-5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both per-system patch sets are checked: patches/vscodium/linux/**
        # here and patches/vscodium/windows/** on Windows. The job does not
        # compile, so running both is cheap.
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Provide jq (Windows only; Linux runners ship it)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v jq > /dev/null 2>&1; then
            choco install jq -y --no-progress
          fi

      - name: Read the pinned commit
        id: pin
        shell: bash
        run: |
          jq -r '"commit=" + .commit' upstream/stable.json >> "$GITHUB_OUTPUT"

      # The object database is ~320 MB and is keyed by the pinned commit, so a
      # push that does not move the pin reuses it instead of re-downloading the
      # VS Code tree.
      - name: Cache the pinned VS Code source objects
        uses: actions/cache@v4
        with:
          path: picode-source/.git
          key: vscode-git-${{ runner.os }}-${{ steps.pin.outputs.commit }}
          restore-keys: |
            vscode-git-${{ runner.os }}-

      - name: Fetch the pinned source (incremental on a cache hit)
        shell: bash
        run: bash dev/get_repo.sh --fetch

      - name: Phases 1-5 (fetch + patch, no compile)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ inputs.report_sha }}
        run: bash dev/ci/pin-check.sh
