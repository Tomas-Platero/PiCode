name: release-api-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Draft vs published release creation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="repos/${GITHUB_REPOSITORY}"
          make() {
            local draft="$1" notes="$2"
            gh api -X POST "${API}/releases" \
              -f tag_name="probe-delete-me" \
              -f name="probe" \
              -f target_commitish="master" \
              -F "draft=${draft}" -F "generate_release_notes=${notes}" \
              --jq .id 2>/tmp/err || { cat /tmp/err; echo "none"; }
          }
          clean() {
            if [ "$1" != "none" ]; then
              gh api -X DELETE "${API}/releases/$1" --silent || true
            fi
            gh api -X DELETE "${API}/git/refs/tags/probe-delete-me" \
              --silent || true
          }
          echo "== A: published, no notes"
          A=$(make false false)
          echo "A=${A}"
          clean "$A"
          echo "== B: published, generated notes"
          B=$(make false true)
          echo "B=${B}"
          clean "$B"
