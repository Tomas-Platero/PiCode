name: release-api-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can the Actions token create a release, with and without notes?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="repos/${GITHUB_REPOSITORY}"
          make_draft() {
            local notes="$1"
            gh api -X POST "${API}/releases" \
              -f tag_name="probe-delete-me" \
              -f name="probe" \
              -f target_commitish="master" \
              -F draft=true -F "generate_release_notes=${notes}" \
              --jq .id 2>/tmp/err || { cat /tmp/err; echo "none"; }
          }
          echo "== A: draft without notes"
          A=$(make_draft false)
          echo "A=${A}"
          if [ "$A" != "none" ]; then
            gh api -X DELETE "${API}/releases/${A}" --silent
          fi
          echo "== B: draft with generated notes"
          B=$(make_draft true)
          echo "B=${B}"
          if [ "$B" != "none" ]; then
            gh api -X DELETE "${API}/releases/${B}" --silent
          fi
          echo "== cleanup tag if it was created"
          TAG="${API}/git/refs/tags/probe-delete-me"
          gh api -X DELETE "${TAG}" --silent 2>/dev/null \
            && echo "tag deleted" || echo "no tag to delete"
