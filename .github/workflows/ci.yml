# Continuous build for PiCode: compile, test, pack, upload.
#
# The long poles are npm ci (5-8 min cold) and the electron binary download.
# Both are cached: node_modules keyed on the lockfile (build/build-helpers.mjs
# deps-current then reuses it and skips npm ci), the npm cache (covers the pi runtime
# install too) and the electron download cache. A warm run is build.sh's
# own ~3 minutes.
name: CI

on:
  push:
    branches:
      - master
      - beta
      - experimental
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - 'updates/**'
      - 'wiki/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'updates/**'
      - 'wiki/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Nothing here pushes, so the token stays out of the git config: the
      # artifact this job uploads is built from this checkout, and a persisted
      # credential is one way for a token to end up inside something published.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Pin to the repo's .nvmrc instead of a float so CI and local dev
          # never drift apart.
          node-version-file: .nvmrc

      # Every folder says what it does in one paragraph (docs/MAPA.md is built
      # from those paragraphs). Two rules: the documented folders keep their
      # README, and a folder NEW since the base of the PR has to arrive with
      # one. If the base cannot be fetched the static half still runs, so this
      # step can only ever be stricter, never blind.
      - name: Folder documentation
        shell: bash
        env:
          # Through the environment: a ref name is not script text.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            node build/docs.mjs check
          elif git fetch --depth=1 origin "$BASE_REF"; then
            node build/docs.mjs check --base FETCH_HEAD
          else
            # The base could not be fetched: the static half still runs.
            node build/docs.mjs check
          fi

      # node_modules is reused whenever the lockfile has not moved:
      # build.sh's deps-current check then skips npm ci entirely.
      # restore-keys keeps a stale tree usable — build.sh detects the
      # mismatch and reinstalls over it.
      - name: Cache node_modules and npm cache
        uses: actions/cache@v6
        env:
          LOCK: ${{ hashFiles('package-lock.json') }}
        with:
          path: |
            node_modules
            ~\AppData\Local\npm-cache
          key: picode-nm-${{ runner.os }}-${{ env.LOCK }}
          restore-keys: picode-nm-${{ runner.os }}-

      # The pack fetches the electron binary through
      # @vscode/gulp-electron's cache (ELECTRON_SKIP_BINARY_DOWNLOAD
      # keeps it out of node_modules).
      - name: Cache electron binary
        uses: actions/cache@v6
        env:
          LOCK: ${{ hashFiles('package-lock.json') }}
        with:
          path: ~\AppData\Local\electron\Cache
          key: picode-electron-${{ runner.os }}-${{ env.LOCK }}

      # preinstall.ts looks for Visual Studio only under fixed Program Files
      # layouts. The runner image ships it in another edition, so locate it
      # with vswhere and hand the path over via the documented override.
      - name: Locate the C++ toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VSDIR="/c/Program Files (x86)/Microsoft Visual Studio/Installer"
          VSWHERE="${VSDIR}/vswhere.exe"
          if [ ! -f "${VSWHERE}" ]; then
            echo "error: vswhere not found; no Visual Studio here." >&2
            exit 1
          fi
          VS_PATH=$("${VSWHERE}" -latest -products '*' \
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
            -property installationPath | head -1 | tr -d '\r')
          if [ -z "${VS_PATH}" ]; then
            echo "error: no Visual Studio C++ toolset on this runner." >&2
            exit 1
          fi
          # preinstall.ts honors vs2022_install as an explicit override.
          VS_PATH=$(cygpath -m "${VS_PATH}")
          echo "vs2022_install=${VS_PATH}" >> "$GITHUB_ENV"
          echo "C++ toolchain: ${VS_PATH}"

      - name: Validate lockfile
        shell: bash
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing" >&2; exit 1
          fi
          npx --yes npm-check-updates --version >/dev/null 2>&1 || true
          echo "lockfile present"

      - name: Audit dependencies
        shell: bash
        run: npm audit --audit-level=high || true

      - name: Lint shell scripts
        shell: bash
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck build/*.sh
          else
            echo "shellcheck not available; skipping"
          fi

      - name: Auto-generate docs map
        shell: bash
        run: node build/docs.mjs map

      - name: Build
        shell: bash
        env:
          # Authenticates @vscode/ripgrep's GitHub download; a cold
          # npm ci without it hits the unauthenticated rate limit (403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/build.sh

      - name: Connector tests
        shell: bash
        working-directory: extensions/picode
        run: |
          for f in test/*.test.ts; do
            node --experimental-strip-types --test "$f" || exit 1
          done

      # The suites' own types. They run here, but nothing typechecked them
      # before this config existed, and a test calling a function with the wrong
      # shape still passes at runtime.
      - name: Connector test types
        shell: bash
        working-directory: .
        run: node_modules/.bin/tsc -p extensions/picode/tsconfig.test.json

      # What the connector writes into pi's `mcp.json`, through pi's own
      # validator: an entry pi refuses is a server that is configured and
      # silently does nothing.
      - name: MCP entries against pi's validator
        shell: bash
        run: node build/checks.mjs check-mcp

      - name: Resolve the packed folder
        shell: bash
        run: |
          # The packer names the folder after the channel it sealed (PiCode-win32-x64,
          # plus -beta or -experimental for the other channels). build/build-helpers.mjs
          # pack-dir resolves it the same way the checks do, so the upload follows
          # whatever the build actually produced. A glob could not: Git Bash matches
          # case-sensitively and the platform segment on disk is lower case, so
          # `PiCode-Win32-x64*` found nothing.
          PACK=$(node build/build-helpers.mjs pack-dir)
          echo "PACK=${PACK}" >> "$GITHUB_ENV"
          echo "packed folder: ${PACK}"

      - name: Upload the packed editor
        uses: actions/upload-artifact@v7
        with:
          name: PiCode-win32-x64
          # Resolved above, from what the build actually wrote; a wrong name silently
          # uploads nothing, which is how the channel suffix once went unnoticed.
          path: ${{ env.PACK }}/
          if-no-files-found: error

      - name: Job summary
        if: always()
        shell: bash
        env:
          # Through the environment, never expanded into the script itself.
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## CI: ${JOB_STATUS}"
            echo
            # Guard: a failed build must not break the summary step.
            PROD=${PACK}/resources/app/product.json
            if [ -f "$PROD" ]; then
              VER=$(node -p "require('./$PROD').version")
              COMMIT=$(node -p "require('./$PROD').commit")
              echo "- Product version: $VER"
              echo "- Product commit: $COMMIT"
            else
              echo "- Built product not found (build did not complete)."
            fi
            BASE="${{ github.server_url }}/${{ github.repository }}"
            echo "- Run: $BASE/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
