# Continuous build for PiCode: compile, test, pack, upload.
#
# The long poles are npm ci (5-8 min cold) and the electron binary download.
# Both are cached: node_modules keyed on the lockfile (dev/deps-current.mjs
# then reuses it and skips npm ci), the npm cache (covers the pi runtime
# install too) and the electron download cache. A warm run is build.sh's
# own ~3 minutes.
name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - 'updates/**'
      - 'wiki/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'updates/**'
      - 'wiki/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Nothing here pushes, so the token stays out of the git config: the
      # artifact this job uploads is built from this checkout, and a persisted
      # credential is one way for a token to end up inside something published.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Pin to the repo's .nvmrc instead of a float so CI and local dev
          # never drift apart.
          node-version-file: .nvmrc

      # node_modules is reused whenever the lockfile has not moved:
      # build.sh's deps-current check then skips npm ci entirely.
      # restore-keys keeps a stale tree usable — build.sh detects the
      # mismatch and reinstalls over it.
      - name: Cache node_modules and npm cache
        uses: actions/cache@v6
        env:
          LOCK: ${{ hashFiles('picode-source/package-lock.json') }}
        with:
          path: |
            picode-source/node_modules
            ~\AppData\Local\npm-cache
          key: picode-nm-${{ runner.os }}-${{ env.LOCK }}
          restore-keys: picode-nm-${{ runner.os }}-

      # The pack fetches the electron binary through
      # @vscode/gulp-electron's cache (ELECTRON_SKIP_BINARY_DOWNLOAD
      # keeps it out of node_modules).
      - name: Cache electron binary
        uses: actions/cache@v6
        env:
          LOCK: ${{ hashFiles('picode-source/package-lock.json') }}
        with:
          path: ~\AppData\Local\electron\Cache
          key: picode-electron-${{ runner.os }}-${{ env.LOCK }}

      # preinstall.ts looks for Visual Studio only under fixed Program Files
      # layouts. The runner image ships it in another edition, so locate it
      # with vswhere and hand the path over via the documented override.
      - name: Locate the C++ toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VSDIR="/c/Program Files (x86)/Microsoft Visual Studio/Installer"
          VSWHERE="${VSDIR}/vswhere.exe"
          if [ ! -f "${VSWHERE}" ]; then
            echo "error: vswhere not found; no Visual Studio here." >&2
            exit 1
          fi
          VS_PATH=$("${VSWHERE}" -latest -products '*' \
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
            -property installationPath | head -1 | tr -d '\r')
          if [ -z "${VS_PATH}" ]; then
            echo "error: no Visual Studio C++ toolset on this runner." >&2
            exit 1
          fi
          # preinstall.ts honors vs2022_install as an explicit override.
          VS_PATH=$(cygpath -m "${VS_PATH}")
          echo "vs2022_install=${VS_PATH}" >> "$GITHUB_ENV"
          echo "C++ toolchain: ${VS_PATH}"

      - name: Build
        shell: bash
        run: ./dev/build.sh

      - name: Connector tests
        shell: bash
        working-directory: picode-source/extensions/picode
        run: |
          for f in test/*.test.ts; do
            node --experimental-strip-types --test "$f" || exit 1
          done

      # The suites' own types. They run here, but nothing typechecked them
      # before this config existed, and a test calling a function with the wrong
      # shape still passes at runtime.
      - name: Connector test types
        shell: bash
        working-directory: picode-source
        run: node_modules/.bin/tsc -p extensions/picode/tsconfig.test.json

      # What the connector writes into pi's `mcp.json`, through pi's own
      # validator: an entry pi refuses is a server that is configured and
      # silently does nothing.
      - name: MCP entries against pi's validator
        shell: bash
        run: node dev/check-mcp-entries.mjs

      - name: Upload the packed editor
        uses: actions/upload-artifact@v7
        with:
          name: PiCode-win32-x64
          # The output directory is EXACTLY 'PiCode-Win32-x64' (capital W,
          # as build.sh creates it); a wrong case silently uploads nothing.
          path: PiCode-Win32-x64/
          if-no-files-found: error

      - name: Job summary
        if: always()
        shell: bash
        env:
          # Through the environment, never expanded into the script itself.
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## CI: ${JOB_STATUS}"
            echo
            # Guard: a failed build must not break the summary step.
            PROD=PiCode-Win32-x64/resources/app/product.json
            if [ -f "$PROD" ]; then
              VER=$(node -p "require('./$PROD').version")
              COMMIT=$(node -p "require('./$PROD').commit")
              echo "- Product version: $VER"
              echo "- Product commit: $COMMIT"
            else
              echo "- Built product not found (build did not complete)."
            fi
            BASE="${{ github.server_url }}/${{ github.repository }}"
            echo "- Run: $BASE/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
