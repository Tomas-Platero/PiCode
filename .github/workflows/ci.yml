# Continuous build for PiCode: compile, test, pack, upload.
#
# The long poles are npm ci (5-8 min cold) and the electron binary download.
# Both are cached: node_modules keyed on the lockfile (dev/deps-current.mjs
# then reuses it and skips npm ci), the npm cache (covers the pi runtime
# install too) and the electron download cache. A warm run is build.sh's
# own ~3 minutes.
name: CI

on:
  push:
    branches:
      - master
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - 'updates/**'
      - 'wiki/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'updates/**'
      - 'wiki/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pin to the repo's .nvmrc instead of a float so CI and local dev
          # never drift apart.
          node-version-file: .nvmrc

      # node_modules is reused whenever the lockfile has not moved:
      # build.sh's deps-current check then skips npm ci entirely.
      # restore-keys keeps a stale tree usable — build.sh detects the
      # mismatch and reinstalls over it.
      - name: Cache node_modules and npm cache
        uses: actions/cache@v4
        env:
          LOCK: ${{ hashFiles('picode-source/package-lock.json') }}
        with:
          path: |
            picode-source/node_modules
            ~\AppData\Local\npm-cache
          key: picode-nm-${{ runner.os }}-${{ env.LOCK }}
          restore-keys: picode-nm-${{ runner.os }}-

      # The pack fetches the electron binary through
      # @vscode/gulp-electron's cache (ELECTRON_SKIP_BINARY_DOWNLOAD
      # keeps it out of node_modules).
      - name: Cache electron binary
        uses: actions/cache@v4
        env:
          LOCK: ${{ hashFiles('picode-source/package-lock.json') }}
        with:
          path: ~\AppData\Local\electron\Cache
          key: picode-electron-${{ runner.os }}-${{ env.LOCK }}

      - name: Build
        shell: bash
        run: ./dev/build.sh

      - name: Connector tests
        shell: bash
        working-directory: picode-source/extensions/picode
        run: |
          for f in test/*.test.ts; do
            node --experimental-strip-types --test "$f" || exit 1
          done

      - name: Upload the packed editor
        uses: actions/upload-artifact@v4
        with:
          name: PiCode-win32-x64
          # The output directory is EXACTLY 'PiCode-Win32-x64' (capital W,
          # as build.sh creates it); a wrong case silently uploads nothing.
          path: PiCode-Win32-x64/
          if-no-files-found: error

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CI: ${{ job.status }}"
            echo
            # Guard: a failed build must not break the summary step.
            PROD=PiCode-Win32-x64/resources/app/product.json
            if [ -f "$PROD" ]; then
              VER=$(node -p "require('./$PROD').version")
              COMMIT=$(node -p "require('./$PROD').commit")
              echo "- Product version: $VER"
              echo "- Product commit: $COMMIT"
            else
              echo "- Built product not found (build did not complete)."
            fi
            BASE="${{ github.server_url }}/${{ github.repository }}"
            echo "- Run: $BASE/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
