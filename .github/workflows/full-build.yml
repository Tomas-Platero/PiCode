# Periodic real compilation and the release pipeline.
#
# The quick check (`pin-check.yml`) only fetches and patches; this workflow
# runs the full `dev/build.sh` so compile errors the preparation cannot see
# are caught. It runs on BOTH platforms: Linux validates the pipeline cheaply,
# and Windows is what the published binary ships from.
#
# When it runs:
#   - nightly, and whenever the pin moves (a push touching upstream/**);
#   - on demand from Actions;
#   - on a push of a tag `v*` — and then the packed trees are published as a
#     release with both binaries attached.
#
# GitHub does not allow `paths` and `tags` filters in the same push trigger,
# so the push trigger fires on every push to the default branch and the tiny
# `gate` job decides whether the expensive build is warranted.
name: Full build

on:
  schedule:
    # Daily, 03:41 UTC.
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - Master
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: full-build
  # A new build (tag, nightly, dispatch) supersedes whatever is running: the
  # owner asked for exactly this - an old run left compiling burns quota for
  # nothing, and its artifacts are stale the moment the new commit exists.
  cancel-in-progress: true

jobs:
  gate:
    # The only job a regular push runs: does this push move the pin? A tag,
    # the nightly and a manual dispatch always build.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide whether the build is warranted
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag and a manual dispatch always build. A push builds only when
          # the pin moved. The nightly builds only when something relevant
          # changed since the last successful build — compiling an unchanged
          # tree every night discovers nothing and costs an hour.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
             || [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            decision="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            decision="false"
            before="${GITHUB_EVENT_BEFORE}"
            zero=0000000000000000000000000000000000000000
            if [[ -z "${before}" || "${before}" == "${zero}" ]]; then
              decision="true"
            else
              compare="repos/${GITHUB_REPOSITORY}/compare"
              files="$( gh api "${compare}/${before}...${GITHUB_SHA}" \
                --jq '[.files[].filename] | join(" ")' 2>/dev/null )" \
                || files=""
              if [[ "${files}" == *"upstream/"* ]]; then
                decision="true"
              fi
            fi
          else
            decision="true"
            runs="actions/workflows/full-build.yml/runs"
            last="$( gh api \
              "repos/${GITHUB_REPOSITORY}/${runs}?status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""' 2>/dev/null )" \
              || last=""
            if [[ -z "${last}" ]]; then
              : # no successful build yet: build
            elif [[ "${last}" == "${GITHUB_SHA}" ]]; then
              decision="false" # nothing new since it
            else
              compare="repos/${GITHUB_REPOSITORY}/compare"
              changed="$( gh api "${compare}/${last}...${GITHUB_SHA}" \
                --jq '[.files[].filename] | join(" ")' 2>/dev/null )"
              if [[ -n "${changed}" ]]; then
                decision="false"
                for prefix in upstream/ patches/ dev/ distribution/ .nvmrc; do
                  if [[ "${changed}" == *"${prefix}"* ]]; then
                    decision="true"
                  fi
                done
              fi
              # an empty or failed compare keeps decision=true: fail safe
            fi
          fi
          echo "decision: build=${decision}"
          echo "build=${decision}" >> "$GITHUB_OUTPUT"

  build:
    name: full build (${{ matrix.os }})
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # Hard ceilings well under anything that could look hung: a healthy build
    # needs ~45 min (Linux) or ~70 (Windows) with warm caches.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux leg compiles on the org's larger runner (16 GB): the
          # standard runner's 7.9 GB was the source of every OOM kill. The
          # Windows leg stays on the standard runner - it compiles fine and
          # larger Windows runners bill at a much higher multiplier.
          - os: ubuntu-latest-m
            timeout: 105
          - os: windows-latest
            timeout: 140
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Provide jq (Windows only; Linux runners ship it)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v jq > /dev/null 2>&1; then
            choco install jq -y --no-progress
          fi

      # A full VS Code build writes several GB; the Linux runner needs room.
      - name: Free disk space
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Read the product and pin versions
        id: versions
        shell: bash
        run: |
          jq -r '"commit=" + .commit' upstream/stable.json \
            >> "$GITHUB_OUTPUT"
          app_version="$( jq -r '.set.version' \
            distribution/product-delta.json )"
          echo "version=${app_version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "pkg_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_version=${app_version}" >> "$GITHUB_OUTPUT"
          fi

      # The object database is ~320 MB and is keyed by the pinned commit.
      - name: Cache the pinned VS Code source objects
        uses: actions/cache@v6
        with:
          path: picode-source/.git
          key: vscode-git-${{ runner.os }}-${{ steps.versions.outputs.commit }}
          restore-keys: |
            vscode-git-${{ runner.os }}-

      # Reused only when VS Code's own install state proves it current (see
      # PICODE_FAST_INSTALL in dev/build.sh); otherwise `npm ci` runs.
      - name: Cache the installed dependencies
        uses: actions/cache@v6
        with:
          path: picode-source/node_modules
          key: vscode-deps-${{ runner.os }}-${{ steps.versions.outputs.commit }}
          restore-keys: |
            vscode-deps-${{ runner.os }}-

      - name: Cache npm tarballs and node headers
        uses: actions/cache@v6
        with:
          path: |
            $(npm config get cache)
            ~/.cache/node-gyp
          key: npm-cache-${{ runner.os }}-${{ steps.versions.outputs.commit }}
          restore-keys: |
            npm-cache-${{ runner.os }}-

      - name: Install the native build and packaging dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          free -m || true
          # ubuntu-24.04 runners ship systemd-oomd: on sustained memory pressure
          # it kills the whole cgroup (runner agent included) BEFORE the kernel
          # OOM killer ever writes "Killed" - which is why every long compile
          # died with a bare "runner has received a shutdown signal" ~12 minutes
          # into compile-src, heap-independent. The compile is the job's job.
          sudo systemctl stop systemd-oomd || true
          sudo systemctl disable systemd-oomd || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev pkg-config \
            fakeroot rpm

      - name: Verify the Spectre libraries and point the build at VS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vsroot="/c/Program Files (x86)/Microsoft Visual Studio"
          vsw="${vsroot}/Installer/vswhere.exe"
          spectre=Microsoft.VisualStudio.Component.VC.Runtimes
          spectre="${spectre}.x86.x64.Spectre"
          installation="$( "$vsw" -latest -products '*' \
            -requires "${spectre}" \
            -property installationPath )"
          if [[ -z "${installation}" ]]; then
            echo "::error::the Spectre-mitigated libraries are missing"
            exit 1
          fi
          # VS Code's preinstall looks for Visual Studio in hardcoded
          # year-folder paths, which the runner's layout does not match;
          # vs2022_install is the override it honours first.
          echo "vs2022_install=${installation}" >> "$GITHUB_ENV"
          echo "Visual Studio: ${installation}"

      - name: Fetch the pinned source (incremental on a cache hit)
        shell: bash
        run: bash dev/get_repo.sh --fetch

      - name: Full build (compile and pack)
        shell: bash
        env:
          # Reuse the cached node_modules only when its recorded install state
          # matches this tree; otherwise dev/build.sh runs `npm ci` as usual.
          PICODE_FAST_INSTALL: "yes"
          # The build downloads release assets from api.github.com (the js-debug
          # extension among them); anonymous requests from shared runner IPs hit
          # the 60/hour cap and fail with 403. fetch.ts honours this token.
          GITHUB_TOKEN: ${{ github.token }}
          # The larger Linux runner has room for the heap the bundler wanted;
          # build.sh honours this override over its per-OS default.
          NODE_HEAP_MB: "12288"
        run: ./dev/build.sh

      - name: Build the Windows installer (setup.exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd picode-source
          # inno_updater.exe lives in tools/ and the .iss copies it into the
          # installer; without this task Inno aborts with "No files found
          # matching ...\tools\*" (measured in CI). It is a separate task from
          # the setup task in VS Code's own pipeline too.
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-system-setup

      - name: Build the Linux installers (.deb and .rpm)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd picode-source
          # Each build task reads the directory its prepare task creates, so the
          # pairs run one invocation at a time: a single gulp call with both
          # names runs them in parallel and build-deb raced prepare-deb with
          # 'spawn /bin/sh ENOENT' (measured in CI).
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm

      - name: Code-sign the Windows binaries (only when a certificate is set)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PICODE_CODESIGN_PFX: ${{ secrets.PICODE_CODESIGN_PFX }}
          PICODE_CODESIGN_PASSWORD: ${{ secrets.PICODE_CODESIGN_PASSWORD }}
        run: |
          if [[ -z "${PICODE_CODESIGN_PFX}" ]]; then
            echo "no certificate configured: binaries stay unsigned"
            echo "(Windows shows a SmartScreen warning on first run)"
            exit 0
          fi
          pfx="${RUNNER_TEMP}/codesign.pfx"
          base64 --decode <<< "${PICODE_CODESIGN_PFX}" > "${pfx}"
          signtool="$( find "${LOCALAPPDATA}/Microsoft Windows Kits" \
            -name signtool.exe 2>/dev/null | sort | tail -1 )"
          targets=()
          targets+=( "$( ls -d PiCode-win32-* | head -1 )/PiCode.exe" )
          targets+=( $( ls picode-source/.build/win32-x64/system-setup/*.exe ) )
          for target in "${targets[@]}"; do
            "${signtool}" sign /fd SHA256 /f "${pfx}" \
              /p "${PICODE_CODESIGN_PASSWORD}" "${target}"
          done
          rm -f "${pfx}"

      - name: Package the portable tree
        id: package
        shell: bash
        env:
          PKG_VERSION: ${{ steps.versions.outputs.pkg_version }}
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            pack_dir="$( ls -d PiCode-linux-* | head -1 )"
            tar -czf "PiCode-${PKG_VERSION}-linux-x64.tar.gz" \
              "${pack_dir}"
            # Debian renames the arch: the deb tasks build under amd64, not x64.
            deb="$( ls picode-source/.build/linux/deb/amd64/deb/*.deb )"
            # buildRpmPackage copies the finished .rpm straight into
            # .build/linux/rpm/x86_64/ - no need to dig into rpmbuild/RPMS.
            rpm="$( ls picode-source/.build/linux/rpm/x86_64/*.rpm )"
            cp "${deb}" "PiCode-${PKG_VERSION}-linux-x64.deb"
            cp "${rpm}" "PiCode-${PKG_VERSION}-linux-x64.rpm"
            sha256sum PiCode-${PKG_VERSION}-linux-* \
              >> SHA256SUMS-linux.txt
            echo "artifact=PiCode-${PKG_VERSION}-linux" \
              >> "$GITHUB_OUTPUT"
          else
            pack_dir="$( ls -d PiCode-win32-* | head -1 )"
            powershell -NoProfile -Command \
              "Compress-Archive -Path '${pack_dir}' \
              -DestinationPath 'PiCode-${PKG_VERSION}-win-x64.zip' -Force"
            setup="$( ls picode-source/.build/win32-x64/system-setup/*.exe )"
            cp "${setup}" "PiCode-${PKG_VERSION}-win-x64-setup.exe"
            sha256sum PiCode-${PKG_VERSION}-win-* \
              >> SHA256SUMS-win.txt
            echo "artifact=PiCode-${PKG_VERSION}-win" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the packed binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            PiCode-*-linux-x64.tar.gz
            PiCode-*-linux-x64.deb
            PiCode-*-linux-x64.rpm
            PiCode-*-win-x64.zip
            PiCode-*-win-x64-setup.exe
            SHA256SUMS-linux.txt
            SHA256SUMS-win.txt
          if-no-files-found: error
          retention-days: 14

  release:
    # Only a tag push publishes: the nightly and the pin-move builds keep
    # their artifacts for 14 days, enough to pull a binary by hand.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download both binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Both matrix legs wrote their own checksums file (same name inside
          # different artifacts); merge them into the one the release carries.
          cat dist/SHA256SUMS-linux.txt dist/SHA256SUMS-win.txt \
            > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
          gh release create "${TAG}" dist/PiCode-* dist/SHA256SUMS.txt \
            --title "PiCode ${TAG#v} — portable and installers" \
            --notes "Built from the pinned VS Code source (see
          upstream/stable.json).

          Windows: PiCode-x-win-x64-setup.exe (installer),
          PiCode-x-win-x64.zip (portable). The binaries are unsigned, so
          SmartScreen shows a warning on first run — More info, Run anyway.

          Linux: PiCode-x-linux-x64.deb and .rpm (installers),
          PiCode-x-linux-x64.tar.gz (portable).

          SHA256SUMS.txt carries the checksums of every archive."
