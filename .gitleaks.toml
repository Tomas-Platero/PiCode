# gitleaks config for PiCode (extends the default ruleset).
#
# The blocked findings were all inside the build output (`PiCode-*/`) and the
# prepared source tree (`picode-source/`): both are gitignored artifacts that
# never leave the machine, and the matches are the editor's own code — the git
# extension's API-key detection, extension-editing's manifest validation, the
# extension host's policy gates and the ssh-config parser — matching themselves.
# No secret was ever found; the artifacts are excluded so the scan reads the
# source the repository actually carries.
[extend]
useDefault = true

[allowlist]
description = "Build artifacts and prepared trees: gitignored, not published"
paths = [
  '''(^|/)PiCode-[^/]*/''',
  '''(^|/)picode-source/''',
]

# Allowlisted **by value**, not by path, so any other key in those same files still fails the scan.
regexes = [
  # Microsoft's own AI key, shipped with VS Code's built-in extensions. It is at HEAD in nine
  # `extensions/*/package.json` files (git, html/json language features, …) and in the bundles
  # built from them, identical everywhere. It is not a PiCode credential, PiCode talks to no
  # Microsoft service, and it cannot be rotated from here — it belongs to the upstream editor.
  '''0c6ae279ed8443289764825290e4f9e2-1a736e7c-1324-4338-be46-fc2a58ae4d14-7255''',
]
