<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';" />
	<title>PiCode</title>
	<link rel="stylesheet" href="onboarding.css" />
	<link rel="stylesheet" href="import.css" />
</head>

<body>
	<div id="import-view" class="import-view" hidden></div>
	<div class="shell">
		<aside class="rail">
			<div class="brand">
				<img class="brand-mark" src="media/picode.svg" alt="" />
				<div class="brand-text">
					<strong>PiCode</strong>
					<span id="rail-subtitle">Setup</span>
				</div>
			</div>

			<nav id="steps" class="steps" aria-label="Setup"></nav>
		</aside>

		<main class="content">
			<div class="steps-scroll">
			<div id="notice" class="notice" role="status" hidden>
				<span class="notice-text" id="notice-text"></span>
				<button id="notice-close" class="notice-close" type="button" title="Dismiss">×</button>
			</div>

			<!-- The five steps: painted from data by onboarding.js. -->
			<section class="step" data-step="welcome" hidden></section>
			<section class="step" data-step="layout" hidden></section>
			<section class="step" data-step="agent" hidden></section>
			<section class="step" data-step="look" hidden></section>
			<section class="step" data-step="done" hidden></section>
			</div>

			<footer class="footer">
				<div class="footer-left">
					<div class="lang" id="lang">
						<button type="button" id="language" class="language" aria-haspopup="listbox" aria-expanded="false" aria-controls="language-list" aria-label="Language"></button>
						<ul id="language-list" class="lang-list" role="listbox" aria-label="Language" hidden></ul>
					</div>
					<button id="skip" class="link skip" type="button"></button>
				</div>
				<div class="footer-right">
					<span id="busy" class="busy" hidden><i class="spinner"></i><span id="busy-text"></span></span>
					<button id="back" class="secondary" type="button"></button>
					<button id="next" class="primary" type="button"></button>
				</div>
			</footer>
		</main>
	</div>

	<script src="flags.js"></script>
	<script src="l10n/en.js"></script>
	<script src="l10n/cs.js"></script>
	<script src="l10n/de.js"></script>
	<script src="l10n/es.js"></script>
	<script src="l10n/fr.js"></script>
	<script src="l10n/it.js"></script>
	<script src="l10n/ja.js"></script>
	<script src="l10n/ko.js"></script>
	<script src="l10n/pl.js"></script>
	<script src="l10n/pt-br.js"></script>
	<script src="l10n/ru.js"></script>
	<script src="l10n/tr.js"></script>
	<script src="l10n/zh-cn.js"></script>
	<script src="l10n/zh-tw.js"></script>
	<script src="import.js"></script>
	<script src="onboarding.js"></script>
</body>

</html>
